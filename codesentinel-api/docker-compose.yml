services:
  api:
    build:
      context: ..
      dockerfile: codesentinel-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://codesentinel:codesentinel@db:5432/codesentinel
      MODEL_SERVER_URL: http://model-server:8001
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      model-server:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesentinel
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  model-server:
    build:
      context: ..
      dockerfile: codesentinel-model/Dockerfile
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
  frontend:
    build:
      context: ../codesentinel-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports: ["127.0.0.1:3002:80"]
    depends_on:
      - api
      - model-server
  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
