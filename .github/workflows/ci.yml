name: CodeSentinel CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: codesentinel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codesentinel-api/pyproject.toml
      - name: Install model runtime and API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./codesentinel-model
          pip install -e './codesentinel-api[dev]'
      - name: Run API tests
        working-directory: codesentinel-api
        run: pytest -q

  model:
    name: Model pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codesentinel-model/requirements.txt
      - name: Install model development dependencies
        working-directory: codesentinel-model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run model tests
        working-directory: codesentinel-model
        run: pytest tests/ -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codesentinel-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: codesentinel-frontend
        run: npm ci
      - name: Lint
        working-directory: codesentinel-frontend
        run: npm run lint
      - name: Build
        working-directory: codesentinel-frontend
        run: npm run build

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, model, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codesentinel-api/Dockerfile
          push: false
          tags: codesentinel-api:ci
      - name: Build model server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codesentinel-model/Dockerfile
          push: false
          tags: codesentinel-model:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: codesentinel-frontend
          file: codesentinel-frontend/Dockerfile
          push: false
          tags: codesentinel-frontend:ci

  publish:
    name: Publish images to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    needs: [api, model, frontend, images]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      registry: ${{ steps.registry.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: codesentinel-${{ github.run_id }}
      - id: account
        name: Get AWS account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
      - id: registry
        name: Set ECR registry
        run: echo "value=${{ steps.account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codesentinel-api/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.value }}/codesentinel-api:${{ github.sha }}
            ${{ steps.registry.outputs.value }}/codesentinel-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Push model service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codesentinel-model/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.value }}/codesentinel-model:${{ github.sha }}
            ${{ steps.registry.outputs.value }}/codesentinel-model:latest
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: codesentinel-frontend
          file: codesentinel-frontend/Dockerfile
          build-args: VITE_API_BASE_URL=/api
          push: true
          tags: |
            ${{ steps.registry.outputs.value }}/codesentinel-frontend:${{ github.sha }}
            ${{ steps.registry.outputs.value }}/codesentinel-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy staging through SSM
    if: needs.publish.result == 'success' && vars.AWS_EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: codesentinel-deploy-${{ github.run_id }}
      - name: Deploy exact commit on EC2
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          parameters=$(jq -nc --arg command "sudo /usr/local/bin/codesentinel-deploy ${IMAGE_TAG}" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM deployment command $command_id"
          exit 1
